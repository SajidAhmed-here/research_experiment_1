name: Sync labels

on:
  push:
    branches:
      - main
    paths:
      - .github/labels.yml
      - .github/workflows/sync-labels.yaml
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # First day of each month at 00:00 UTC

permissions:
  issues: write

jobs:
  sync-labels:
    uses: exercism/github-actions/.github/workflows/labels.yml@main
